services:
  kontor:
    image: ghcr.io/christiancra/kontor:latest
    restart: unless-stopped
    ports:
      # Nur vom Server selbst erreichbar (z. B. für einen Caddy direkt auf dem Host). Von außen
      # kommt man ausschließlich über den Reverse Proxy mit HTTPS an Kontor, nie per http://IP:3000
      - "127.0.0.1:3000:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - kontor-data:/data
    networks:
      default:
      # Über dieses Netz erreicht ein Reverse Proxy aus einem anderen Compose-Projekt
      # (z. B. Caddy) Kontor unter dem festen Namen kontor:3000
      web-proxy:
        aliases:
          - kontor

volumes:
  kontor-data:

networks:
  web-proxy:
    name: web-proxy
