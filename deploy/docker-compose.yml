services:
  kontor:
    image: ghcr.io/christiancra/kontor:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - kontor-data:/data
    networks:
      default:
      # Über dieses Netz erreicht ein Reverse Proxy aus einem anderen Compose-Projekt
      # (z. B. Caddy) Kontor unter dem festen Namen kontor:3000
      web-proxy:
        aliases:
          - kontor

volumes:
  kontor-data:

networks:
  web-proxy:
    name: web-proxy
